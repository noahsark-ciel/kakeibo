<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone ledger. Neutral grey paper (eno-tools palette), charcoal ink. Envelope rows (封筒) with a red 済 hanko for paid lines; bottom tab bar. */
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1f2328; --sub:#6b7178; --line:#dde1e5;
  --accent:#2b2f36; --accent-soft:#f0f2f4; --stamp:#9a4a44; --stamp-soft:#f5e6e4;
  --warn:#7a6334; --neg:#9a4a44; --pos:#46629a;
  --font-body:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-num:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --card:#1e2125; --ink:#e6e8ea; --sub:#9aa0a6; --line:#30343a;
  --accent:#d5d9de; --accent-soft:#272b30; --stamp:#d9958d; --stamp-soft:#3a2624;
  --warn:#d2b77a; --neg:#d9958d; --pos:#93aee0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#e6e8ea; --sub:#9aa0a6; --line:#30343a;
  --accent:#d5d9de; --accent-soft:#272b30; --stamp:#d9958d; --stamp-soft:#3a2624;
  --warn:#d2b77a; --neg:#d9958d; --pos:#93aee0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{scrollbar-gutter:stable;overflow-y:scroll}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--sub);margin:0;letter-spacing:.08em}
h2{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--sub);margin:22px 4px 8px;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sticky-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:-12px 0 0;padding:12px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
select,input{font:inherit;color:var(--ink);background:transparent;border:0;min-width:0}
input{width:100%;padding:6px 0;border-bottom:1px dashed transparent;border-radius:0}
input:focus{outline:none;border-bottom-color:var(--accent)}
input.num{text-align:right}
.period-row{display:grid;grid-template-columns:auto 88px auto 88px 1fr;gap:6px;align-items:center;margin:-4px 0 10px;font-size:13px;color:var(--sub)}
.period-row .date-pick{font-size:14px;color:var(--ink)}
.period-k{font-size:12px;margin-right:4px}
.period-days{justify-self:end;font-size:12px}
@media (hover:hover) and (pointer:fine){.period-row{grid-template-columns:auto 140px auto 140px 1fr}}
.period-in{font-family:var(--font-display);font-size:20px;font-weight:800;padding:2px 0;border-bottom:2px solid var(--accent);max-width:220px}
select.period{font-family:var(--font-display);font-size:20px;font-weight:800;padding:2px 22px 2px 0;appearance:none;-webkit-appearance:none;background:linear-gradient(45deg,transparent 50%,var(--sub) 50%) right 8px center/6px 6px no-repeat, linear-gradient(-45deg,transparent 50%,var(--sub) 50%) right 3px center/6px 6px no-repeat}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.btn{padding:8px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.btn.solid{background:var(--accent);color:var(--card)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.link{font-family:var(--font-body);color:var(--accent);font-weight:700;font-size:13px;padding:4px 2px}
.panel{background:var(--card);border-radius:16px;padding:4px 16px;border:1px solid var(--line)}
.hero{background:var(--card);border-radius:20px;padding:18px 18px 14px;border:1px solid var(--line)}
.hero .label{font-size:12px;color:var(--sub);letter-spacing:.1em}
.hero .big{font-size:40px;font-weight:500;line-height:1.1;margin:2px 0 12px}
.big .yen{font-size:20px;margin-right:2px;color:var(--sub)}
.eq{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
.eq b{font-weight:500;color:var(--ink);text-align:right}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12px;color:var(--sub);margin:4px 0 2px 4px;padding:4px 0 4px 12px;border-left:2px solid var(--line)}
.breakdown b{font-weight:400;color:var(--sub);text-align:right}
.sum-note{font-size:10px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--bg);color:var(--sub);letter-spacing:.04em;vertical-align:1px}
.plan{margin-top:10px;border-top:1px solid var(--line)}
.plan-list{background:var(--bg);border-radius:12px;padding:2px 12px}
.plan-tbl{width:100%;border-collapse:collapse;font-size:14px}
.plan-tbl td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.plan-tbl tr:last-child td{border-bottom:0}
.plan-name{padding-left:12px!important}
.plan-amt{text-align:right;white-space:nowrap;padding-left:12px!important;width:1%}
.plan-amt-ed{width:96px;padding-left:8px!important}
.plan-del{width:28px;padding-left:4px!important}
.plan-tbl td input{padding:4px 0}
.plan-sum{margin-top:10px;display:grid;gap:2px;font-size:13px;color:var(--sub)}
.plan-sum div{display:flex;justify-content:space-between;gap:8px}
.plan-sum b{font-weight:500;color:var(--ink)}
.plan-sum p{margin:4px 0 0;font-size:12px;text-align:right}
.src-pick{justify-self:end;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.src-btn{font-size:11px;padding:3px 10px;border-radius:999px;color:var(--sub)}
.src-btn.on{background:var(--accent);color:var(--card);font-weight:700}
.src-sum{margin-top:8px;border-top:1px dashed var(--line)}
.src-tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.dfield{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px}
.dfield span{font-size:10px;color:var(--sub);white-space:nowrap}
.dfield input{font-size:14px;border-bottom:1px dashed var(--line)}
.alloc-line{font-size:12px;text-align:right;color:var(--ink);font-weight:500;margin-top:-2px}
.alloc-line span{font-size:10px;color:var(--sub);font-weight:400}
.crow{padding:6px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow-top{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px 26px;gap:6px;align-items:center}
.crow-sub{margin-top:2px}
.crow-sub{display:grid;grid-template-columns:auto 96px 1fr;gap:8px;align-items:center}
.crow-k{font-size:11px;color:var(--sub)}
@media (hover:hover) and (pointer:fine){.crow-sub{grid-template-columns:auto 140px 1fr}}
.crow-sub .msel{width:auto;max-width:100%;font-size:12px;color:var(--sub);padding:3px 6px}
.prow{padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow-top{display:grid;grid-template-columns:minmax(0,1fr) 100px 28px;gap:6px;align-items:center}
.prow-cyc{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:2px}
.sel{font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.prow-mo{font-size:11px;color:var(--sub);white-space:nowrap}
.plan-edit-bar{display:flex;justify-content:flex-end;margin:-4px 0 4px}
.prow-ro{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.prow-ro.sub{font-size:11px;color:var(--sub);margin-top:2px}
.prow-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-when{font-size:12px;color:var(--sub);width:34%;line-height:1.35}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{flex:1 1 0;min-width:0;background:var(--bg);border-radius:12px;padding:8px 10px}
.chip .k{font-size:11px;color:var(--sub);letter-spacing:.08em}
.chip .v{font-size:clamp(12px,3.6vw,17px);white-space:nowrap}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{min-width:0}
.row .meta{font-size:12px;color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv label{font-size:14px;color:var(--sub);white-space:nowrap}
.env{border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0}
.env-head{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;text-align:left}
.env-head .t{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center}
.tag{font-size:10px;font-weight:500;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 5px;letter-spacing:.05em}
.env-head .cur{font-size:20px;text-align:right}
.env-head .calc{grid-column:1/-1;font-size:12px;color:var(--sub)}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar i.over{background:var(--neg)}
.env-body{padding:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:6px}
.field{display:flex;flex-direction:column;font-size:11px;color:var(--sub)}
.field input{font-size:15px}
.items{background:var(--bg);border-radius:12px;padding:2px 12px;margin-top:4px}
.item{display:grid;grid-template-columns:1fr 110px 28px;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.acc-sel{grid-column:1/-1;font-size:12px;color:var(--sub);padding:0 0 4px}
.item.w-date{grid-template-columns:64px 1fr 96px 44px 28px}
.del{width:28px;height:28px;border-radius:50%;color:var(--sub);font-size:16px;line-height:1}
.del{position:relative}
.neg{color:var(--neg)} .pos{color:var(--pos)} .warn{color:var(--warn)}
.stamp{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;border:2px dashed var(--line);color:var(--sub);transition:transform .15s}
.stamp.on{border:2px solid var(--stamp);color:var(--stamp);background:var(--stamp-soft);transform:rotate(-10deg)}
.stamp.sm{width:34px;height:34px;font-size:13px}
.event{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px 8px;margin-bottom:10px}
.event-h{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.event-h input.title{font-weight:700;font-size:16px}
.event-h input.date{font-size:13px;color:var(--sub)}
.bitem{display:grid;grid-template-columns:1fr 96px 40px 28px;gap:6px;align-items:center;border-bottom:1px dashed var(--line);padding:2px 0}
.bitem:last-of-type{border-bottom:0}
.ev-row{width:100%;display:grid;grid-template-columns:22px 18px 58px minmax(0,1fr) auto;gap:6px;align-items:center;min-height:48px;padding:4px 0;text-align:left}
.ev-row.is-open{border-bottom:1px dashed var(--line)}
.ev-row .ev-date,.ev-row .ev-date-in{font-size:12px;color:var(--sub)}
.ev-row .ev-title,.ev-row .ev-title-in{font-weight:700;font-size:16px}
.ev-chev{width:18px;height:40px;display:flex;align-items:center;justify-content:flex-start;padding:0}
.ev-row.is-open .chev{transform:rotate(90deg)}
.date-pick{position:relative;display:flex;align-items:center;min-height:36px;font-size:12px;color:var(--sub);cursor:pointer;border-bottom:1px dashed var(--line)}
.date-pick .ph{opacity:.75}
.date-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none;font-size:16px}
.ev-end{display:grid;grid-template-columns:22px 18px 58px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);padding:2px 0}
.ev-end .date-pick{grid-column:3/4}
.ev-end .link{grid-column:5/6}
@media (hover:hover) and (pointer:fine){
  .date-pick span{display:none}
  .date-pick input{position:static;opacity:1;width:100%;height:auto;font-size:13px;color:var(--sub);background:transparent;padding:6px 0;cursor:pointer;-webkit-appearance:auto;appearance:auto}
  .ev-row,.ev-end{grid-template-columns:22px 18px 136px minmax(0,1fr) auto}
  .date-pick.dp-empty span{display:block;position:absolute;left:0;top:50%;transform:translateY(-50%);pointer-events:none}
  .date-pick.dp-empty input{color:transparent}
  .date-pick.dp-empty:focus-within span{display:none}
  .date-pick.dp-empty input:focus{color:var(--sub)}
}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px}
.tb{font-size:12px;color:var(--sub);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px}
.grip{width:22px;height:40px;display:inline-flex;align-items:center;justify-content:flex-start;color:var(--sub);cursor:grab;touch-action:none;opacity:.6;margin-left:-4px}
.grip svg{fill:currentColor}
.event.dragging{position:relative;z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.18);opacity:1!important}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
div.ev-row[data-act]{cursor:pointer}
.ev-row.is-open input{cursor:text}
.event.alldone{opacity:.62}
.ev-toggle{width:100%;display:grid;grid-template-columns:16px auto 1fr auto;gap:10px;align-items:center;padding:10px 0;text-align:left}
.ev-toggle.open{padding:4px 0 2px;border-bottom:0}
.chev{color:var(--sub);width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;transform-origin:50% 50%;transition:transform .15s}
.chev svg{display:block}
.ev-toggle.open .chev{transform:rotate(90deg)}
.ev-date{font-size:12px;color:var(--sub);white-space:nowrap}
.ev-title{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-sum{display:flex;gap:8px;align-items:center;font-size:14px;justify-self:end;grid-column:-2}
.ev-cnt{font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.ev-cnt.on{color:var(--stamp);border:1px solid var(--stamp);background:var(--stamp-soft);font-weight:700}
.empty{text-align:center;padding:40px 16px;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 10px;border-radius:999px;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card);font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;white-space:nowrap;color:var(--sub);padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs button.tab-center{justify-content:flex-end}
.tab-center .orb{width:64px;height:64px;margin-top:-34px;border-radius:50%;background:var(--accent);color:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:4px solid var(--card);box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .15s}
.tab-center .orb svg{width:24px;height:24px}
.orb-l{font-size:10.5px;font-weight:700;line-height:1;letter-spacing:.06em}
.tabs button.tab-center[aria-current="page"] .orb{transform:scale(1.04)}
.tabs button.tab-center:not([aria-current="page"]) .orb{opacity:.92}

.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--card);border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.sheet .box{border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.sheet .box input{font-size:18px}
.hint{font-size:12px;color:var(--sub)}
.dialog{position:fixed;z-index:32;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,calc(100vw - 48px));background:var(--card);border-radius:18px;padding:20px 18px 16px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.dialog p{margin:0 0 16px;font-size:15px;line-height:1.6;text-align:center;overflow-wrap:anywhere}
.dlg-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-btns .btn{padding:11px 0;font-size:14px;text-align:center}
.btn.danger{background:var(--neg);color:var(--card)}
.sync-banner{background:var(--stamp-soft);color:var(--stamp);border-radius:12px;padding:8px 12px;font-size:12px;margin-bottom:10px}
.field input{border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px}
.status{font-size:11px;color:var(--sub)}
.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--sub);font-size:11px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td input{padding:6px 0}
.scroll{overflow-x:auto}
.foot-note{font-size:12px;color:var(--sub);margin:8px 4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="empty"><b>家計簿を読み込み中…</b>保存されたデータを取得しています。</div>
</div>
<div id="layer"></div>
<div class="tabs"><nav id="tabs" aria-label="画面切り替え"></nav></div>

<script>
(()=>{
const TABS=[
 ['assets','資産','<path d="M3 10l9-6 9 6M5 10v9M19 10v9M9.5 10v9M14.5 10v9M3 20h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'],
 ['bonus','賞与','<path d="M5 10h14v10H5zM3 7h18v3H3zM12 7v13M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'],
 ['month','今月','<rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8.5 3v4M15.5 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.6 12.2l2.4 2.9 2.4-2.9M12 15.1v3.4M10.2 16.3h3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'],
 ['cards','カード','<rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M7 15h4" stroke="currentColor" stroke-width="1.8"/>'],
 ['funds','サブスク','<ellipse cx="12" cy="7" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" fill="none" stroke="currentColor" stroke-width="1.8"/>']
];
const S={months:{},bonus:{},one:{},loaded:{months:false,bonus:false,one:false},
  ui:{tab:'month',month:null,bonus:null,open:{},sheet:null,cardsShowDone:false},db:null,err:null};
S.ui.evOpen={};
try{const t=localStorage.getItem('kk.tab');if(t)S.ui.tab=t==='savings'?'assets':t==='fixed'?'funds':t;S.ui.evOpen=JSON.parse(localStorage.getItem('kk.ev')||'{}')||{}}catch(e){}
function saveEv(){try{localStorage.setItem('kk.ev',JSON.stringify(S.ui.evOpen))}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v)||0;
const yen=v=>{const r=Math.round(n(v));return (r<0?'−':'')+Math.abs(r).toLocaleString('ja-JP')};
const sum=(a,f)=>a.reduce((s,x)=>s+n(f?f(x):x),0);
const clone=o=>JSON.parse(JSON.stringify(o));
function evalAmount(str){
  str=String(str).replace(/[０-９＋－−ー×÷（）．，]/g,c=>({'＋':'+','－':'-','−':'-','ー':'-','×':'*','÷':'/','（':'(','）':')','．':'.','，':''}[c]??String.fromCharCode(c.charCodeAt(0)-0xFEE0))).replace(/[,\s円¥]/g,'');
  if(str==='')return 0;
  if(!/^[\d+\-*/().]+$/.test(str))return null;
  try{const v=Function('"use strict";return ('+str+')')();return Number.isFinite(v)?Math.round(v*100)/100:null}catch(e){return null}
}
function getIn(o,path){return path.split('.').reduce((a,k)=>a?.[k],o)}
function setIn(o,path,v){const ks=path.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
function docOf(path){const [c,id]=path.split('/');return S[c]?.[id]}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function fmtRange(e){const a=fmtDate(e.date)||e.date||'';if(!e.dateEnd||e.dateEnd===e.date)return a;const s=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.date||''),t=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.dateEnd);if(s&&t&&s[2]===t[2])return a+'-'+(+t[3]);return a+'-'+fmtDate(e.dateEnd)}
function datePick(P,key,val,label,ph){return `<label class="date-pick ${val?'':'dp-empty'}"><span class="${val?'':'ph'}">${val?esc(fmtDate(val)):esc(ph)}</span><input type="date" data-doc="${P}" data-key="${key}" data-t="text" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(val||'')?val:'')}" aria-label="${esc(label)}"></label>`}
function fmtDate(s){if(!s)return'';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?`${+m[2]}/${+m[3]}`:s}

/* ---------- storage: Google スプレッドシート (Apps Script) ---------- */
const CFG_KEY='kk.cfg',CACHE_KEY='kk.cache';
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){return null}}
function setCfg(c){try{c?localStorage.setItem(CFG_KEY,JSON.stringify(c)):localStorage.removeItem(CFG_KEY)}catch(e){}}
const api={
  async load(cfg){const u=cfg.url+(cfg.url.includes('?')?'&':'?')+'key='+encodeURIComponent(cfg.key)+'&t='+Date.now();
    const r=await fetch(u,{cache:'no-store',redirect:'follow'});const j=await r.json();if(!j.ok)throw{code:j.error||'error'};return j.docs||{}},
  async post(cfg,body){const r=await fetch(cfg.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key:cfg.key})});
    const j=await r.json();if(!j.ok)throw{code:j.error||'error'};return j}
};
function makeDb(cfg){return {doc:path=>({set:data=>api.post(cfg,{op:'set',path,data}),delete:()=>api.post(cfg,{op:'delete',path})})}}
const pending={},inflight={},failed={};
let syncState='';function setSync(s){syncState=s;const el=document.getElementById('sync');if(el){el.textContent=s;el.dataset.s=s}}
function save(path){pending[path]=true;saveCache();if(!inflight[path])flush(path)}
async function flush(path){
  if(!S.db){toast('保存先が設定されていません');return}
  inflight[path]=true;setSync('保存中…');
  while(pending[path]){
    pending[path]=false;
    const data=clone(docOf(path)||{});data.updatedAt=new Date().toISOString();
    try{await S.db.doc(path).set(data);delete failed[path]}
    catch(e){
      await new Promise(r=>setTimeout(r,800+Math.random()*700));
      try{await S.db.doc(path).set(data);delete failed[path]}
      catch(e2){failed[path]=true;toast(e2?.code==='bad_key'?'合言葉が違うため保存できませんでした':'保存できませんでした。電波のよい所で開き直すと再送します')}
    }
  }
  inflight[path]=false;
  if(!Object.values(inflight).some(Boolean))setSync(Object.keys(failed).length?'未保存あり':'保存済み');
}
function retryFailed(){Object.keys(failed).forEach(p=>{if(docOf(p))save(p);else delete failed[p]})}
function remove(path){const [c,id]=path.split('/');delete S[c][id];saveCache();S.db?.doc(path).delete().catch(()=>toast('削除できませんでした'))}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({months:S.months,bonus:S.bonus,one:S.one,at:Date.now()}))}catch(e){}}
function applyDocs(docs){
  const next={months:{},bonus:{},one:{}};
  Object.entries(docs).forEach(([p,v])=>{const [c,id]=p.split('/');if(next[c]&&id)next[c][id]=clone(v.data||v)});
  ['months','bonus','one'].forEach(c=>{Object.keys(S[c]).forEach(id=>{const p=c+'/'+id;if(pending[p]||inflight[p]||failed[p])next[c][id]=S[c][id]});S[c]=next[c];S.loaded[c]=true});
  saveCache();
}
let loading=false;
async function reload(quiet){
  const cfg=getCfg();if(!cfg||loading)return;
  if(Object.values(inflight).some(Boolean))return;
  loading=true;if(!quiet)setSync('読み込み中…');
  try{const docs=await api.load(cfg);applyDocs(docs);S.err=null;setSync(Object.keys(failed).length?'未保存あり':'最新');retryFailed()}
  catch(e){
    if(e?.code==='bad_key'){S.err='合言葉が違います。「接続設定」から入れ直してください。';S.ui.setup=true}
    else{setSync('オフライン');if(!S.loaded.months)S.err='保存先に接続できませんでした。電波を確認して開き直してください。'}
  }
  loading=false;render();
}
/* ---------- calculations (Excelの式と同じ) ---------- */
function calcBonus(b){
  if(!b)return null;
  const items=(b.events||[]).flatMap(e=>e.items||[]);
  const usable=n(b.base)+n(b.carry)-n(b.saving);
  const budget=sum(items,i=>i.a);
  const paid=sum(items.filter(i=>i.done),i=>i.a);
  return {usable,budget,remain:usable-budget,upcoming:usable-paid,paid};
}
function fundCalc(f){
  const dep=Object.keys(S.months).sort().map(id=>{const t=(S.months[id].tsumitate||[]).find(x=>x.fund===f.id);return t&&n(t.amount)?{date:id,n:'毎月の積立',a:n(t.amount)}:null}).filter(Boolean);
  const ent=f.entries||[];
  const inSum=n(f.opening)+sum(dep,x=>x.a)+sum(ent.filter(e=>e.kind==='in'),e=>e.a);
  const outSum=sum(ent.filter(e=>e.kind!=='in'),e=>e.a);
  return {dep,inSum,outSum,balance:inSum-outSum};
}
function fundsTotal(){return sum(S.one.funds?.funds||[],f=>fundCalc(f).balance)}
function latestBonusId(){const ids=Object.keys(S.bonus);if(!ids.length)return null;return ids.sort((a,b)=>String(S.bonus[a].createdAt||'').localeCompare(String(S.bonus[b].createdAt||''))||a.localeCompare(b))[ids.length-1]}
function latestBonus(){const id=latestBonusId();return id?S.bonus[id]:null}
function cardsPending(){const c=S.one.cards?.cards||[];return sum(c.flatMap(x=>x.items||[]).filter(i=>!i.done),i=>i.a)}
function cardForDebit(name){const cs=S.one.cards?.cards||[];return cs.find(c=>c.name===name)||cs.find(c=>name&&(name.startsWith(c.name)||c.name.startsWith(name.replace(/カード$/,''))))}
function bonusCardSum(m,d){if(!m.start||!m.end)return 0;const c=cardForDebit(d.name);if(!c)return 0;return sum((c.items||[]).filter(i=>i.src==='bonus'&&i.date&&i.date>=m.start&&i.date<=m.end),i=>i.a)}
function sortedOf(m,d){return n(d.sorted)+bonusCardSum(m,d)}
function prevMonthOf(m){const id=Object.keys(S.months).find(k=>S.months[k]===m);if(id==null)return null;const p=Object.keys(S.months).filter(k=>k<id).sort().pop();return p==null?null:S.months[p]}
function carryOf(m,e,i,prevCalc){
  if(!prevCalc)return n(e.carry);
  const pe=(prevCalc.m.envelopes||[]);let j=pe.findIndex(x=>x.name===e.name);if(j<0)j=i<pe.length?i:-1;
  return j<0?n(e.carry):Math.round(prevCalc.E[j].cur);
}
const inUpcoming=e=>e.manage==='口座'||e.name==='医療費';
function migrateMonth(m){
  const envs=m.envelopes||[];
  if(envs.some(e=>e.rule==='rest')){
    m.extras=(m.extras||[]).concat(envs.filter(e=>e.rule==='rest').flatMap(e=>e.items||[]));
    m.envelopes=m.envelopes.filter(e=>e.rule!=='rest');
  }
  const living=(m.envelopes||[]).filter(e=>e.name==='生活費');
  if(living.length){
    m.debits=(m.debits||[]).concat(living.map(e=>({name:'PayPay',manage:'',amount:e.rule==='perDay'?n(m.days)*n(e.rate||1000):n(e.alloc),sorted:0,done:false})));
    m.envelopes=m.envelopes.filter(e=>e.name!=='生活費');
  }
  (m.debits||[]).forEach(d=>{if(d.name==='生活費')d.name='PayPay'});
}
function calcMonth(m){
  migrateMonth(m);
  const pm=prevMonthOf(m),prevCalc=pm?{...calcMonth(pm),m:pm}:null;
  const envs=m.envelopes||[];const debits=m.debits||[];
  const debitAlloc=sum(debits,d=>n(d.amount)-sortedOf(m,d));
  const envAlloc=envs.map(e=>e.rule==='perDay'?n(m.days)*n(e.rate||1000):n(e.alloc));
  const tsumiAlloc=sum(m.tsumitate||[],t=>t.amount);
  const allocTotal=sum(envAlloc)+debitAlloc+tsumiAlloc;
  const start=n(m.salary)-allocTotal;
  const E=envs.map((e,i)=>{
    const alloc=envAlloc[i];
    const carry=carryOf(m,e,i,prevCalc);
    const total=carry+alloc;
    let spent,cur;
    if(e.balanceMode){cur=e.balance==null||e.balance===''?0:n(e.balance);spent=total-cur}
    else{spent=sum(e.items||[],x=>x.a);cur=total-spent}
    return {alloc,carry,total,spent,cur};
  });
  const extraSum=sum(m.extras||[],x=>x.a);
  const balance=start-extraSum;
  const assets=sum(S.one.assets?.accounts||[],a=>a.a);
  const bonusUp=sum(Object.values(S.bonus),b=>calcBonus(b).upcoming);
  const envUp=sum(envs.map((e,i)=>inUpcoming(e)?E[i].cur:0));
  const debitUp=sum(debits.filter(d=>!d.done),d=>n(d.amount)-sortedOf(m,d));
  const cardUp=cardsPending();
  const fundUp=fundsTotal();
  const upcoming=bonusUp+envUp+fundUp+debitUp+cardUp;
  return {E,extraSum,debitAlloc,tsumiAlloc,allocTotal,start,balance,assets,bonusUp,envUp,fundUp,debitUp,cardUp,upcoming,left:assets-upcoming};
}

/* ---------- 資産口座との連動 ---------- */
const accList=()=>S.one.assets?.accounts||[];
function ensureAccIds(){let ch=false;accList().forEach(a=>{if(!a.id){a.id='a'+Math.random().toString(36).slice(2,8);ch=true}});if(ch)save('one/assets')}
function accById(id){return accList().find(a=>a.id===id)}
function syncAcc(it){
  const o=it.accOn&&accById(it.accOn);if(o)o.a=n(o.a)+n(it.accA);
  const a=it.acc&&accById(it.acc);
  if(a){a.a=n(a.a)-n(it.a);it.accOn=it.acc;it.accA=n(it.a)}else{it.accOn='';it.accA=0}
  save('one/assets');
}
function releaseAcc(it){if(!it)return;const o=it.accOn&&accById(it.accOn);if(o){o.a=n(o.a)+n(it.accA);save('one/assets')}}
const accOpts=val=>'<option value="">引落元なし</option>'+accList().map(a=>`<option value="${esc(a.id)}" ${a.id===val?'selected':''}>${esc(a.n)}</option>`).join('');
const accSel=(P,key,val)=>`<select class="acc-sel" data-doc="${P}" data-key="${key}" data-t="text" aria-label="引落元の口座">${accOpts(val)}</select>`;
/* ---------- small UI builders ---------- */
const numIn=(doc,key,val,extra='')=>`<input class="num" inputmode="decimal" data-doc="${doc}" data-key="${key}" data-t="num" value="${val===null||val===undefined||val===''?'':esc((Math.round(n(val)*100)/100).toLocaleString('ja-JP'))}" ${extra}>`;
const txtIn=(doc,key,val,extra='')=>`<input data-doc="${doc}" data-key="${key}" data-t="text" value="${esc(val)}" ${extra}>`;
const delBtn=(doc,arr,idx,label='項目')=>`<button class="del" data-act="del" data-doc="${doc}" data-arr="${arr}" data-idx="${idx}" aria-label="${esc(label)}を削除">×</button>`;
const stamp=(doc,key,on,cls='')=>`<button class="stamp ${cls} ${on?'on':''}" data-act="toggle" data-doc="${doc}" data-key="${key}" aria-pressed="${on}" aria-label="支払い済み">${on?'済':'未'}</button>`;

/* ---------- views ---------- */
function monthIds(){return Object.keys(S.months).sort().reverse()}
function viewMonth(){
  const ids=monthIds();
  if(!ids.length)return `<div class="empty"><b>まだ月のデータがありません</b>最初の月を作ると、封筒ごとの予算と引落しを管理できます。<div style="margin-top:16px"><button class="btn solid" data-act="first-month">最初の月を作成</button></div></div>`;
  if(!S.ui.month||!S.months[S.ui.month])S.ui.month=ids[0];
  const id=S.ui.month,m=S.months[id],P='months/'+id,c=calcMonth(m);
  ensureAccIds();
  const envs=m.envelopes||[];
  const envHtml=envs.map((e,i)=>{
    const r=c.E[i],open=S.ui.open['env'+i];
    const pct=r.total>0?Math.min(100,Math.max(0,r.spent/r.total*100)):0;
    let body='';
    if(open){
      body=`<div class="env-body"><div class="grid2">
        <label class="field">前月繰越${monthIds().length>1&&prevMonthOf(m)?`<input class="num" disabled value="${yen(r.carry)}" aria-label="前月の残りを自動で繰越">`:numIn(P,`envelopes.${i}.carry`,e.carry)}</label>
        <label class="field">今月割当${e.rule==='perDay'?`<input class="num" disabled value="${yen(r.alloc)}" aria-label="日数×${e.rate||1000}円">`:numIn(P,`envelopes.${i}.alloc`,e.alloc)}</label>
      </div>
      ${e.rule==='perDay'?`<p class="hint">割当は 日数 × ${yen(e.rate||1000)}円 で自動計算</p>`:''}
      ${e.balanceMode?`<label class="field">いまの残高（PayPayなどを見て入力）${numIn(P,`envelopes.${i}.balance`,e.balance,'placeholder="未入力"')}</label>`:
      `<div class="items">${(e.items||[]).map((it,j)=>`<div class="item">${txtIn(P,`envelopes.${i}.items.${j}.n`,it.n,'placeholder="品目" aria-label="品目"')}${numIn(P,`envelopes.${i}.items.${j}.a`,it.a,'aria-label="金額"')}${delBtn(P,`envelopes.${i}.items`,j)}${accSel(P,`envelopes.${i}.items.${j}.acc`,it.acc)}</div>`).join('')||'<p class="hint">まだ支出はありません</p>'}</div>
      <div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="link" data-act="quick" data-env="${i}">＋ ${esc(e.name)}に支出を追加</button></div>`}
      </div>`;
    }
    return `<div class="env"><button class="env-head" data-act="open" data-k="env${i}" aria-expanded="${!!open}">
      <span class="t">${esc(e.name)}<span class="tag">${esc(e.manage||'')}</span></span>
      <span class="cur num ${r.cur<0?'neg':''}">${yen(r.cur)}</span>
      <span class="calc num">${yen(r.spent)} / ${yen(r.total)}</span>
      <span class="bar"><i class="${r.cur<0?'over':''}" style="width:${pct}%"></i></span>
    </button>${body}</div>`;
  }).join('');
  const debits=(m.debits||[]).map((d,i)=>`<div class="row" style="grid-template-columns:1fr auto auto">
     <div class="name">${S.ui.open.debEdit?`${txtIn(P,`debits.${i}.name`,d.name,'aria-label="名前"')}${txtIn(P,`debits.${i}.manage`,d.manage,'placeholder="メモ・日付" aria-label="メモ" style="font-size:12px;color:var(--sub)"')}`:`<div>${esc(d.name)}</div><div class="meta">${esc(fmtDate(d.manage))}${sortedOf(m,d)?`${d.manage?' · ':''}振分け済 −${yen(sortedOf(m,d))}`:''}${bonusCardSum(m,d)?`（うち賞与から支払い ${yen(bonusCardSum(m,d))}）`:''}</div>`}</div>
     <div style="width:${S.ui.open.debEdit?'120':'104'}px">${S.ui.open.debEdit?`<label class="dfield"><span>引落し額</span>${numIn(P,`debits.${i}.amount`,d.amount,'aria-label="引落し額"')}</label><label class="dfield"><span>振分け済</span>${numIn(P,`debits.${i}.sorted`,d.sorted,'aria-label="振分け済（手入力分）" placeholder="0"')}</label>${bonusCardSum(m,d)?`<div class="meta num" style="font-size:11px;text-align:right">＋賞与から ${yen(bonusCardSum(m,d))}</div>`:''}`:numIn(P,`debits.${i}.amount`,d.amount,'aria-label="引落し額"')}${!S.ui.open.debEdit&&(cardForDebit(d.name)||sortedOf(m,d))?`<div class="alloc-line num"><span>今月割当</span> ${yen(n(d.amount)-sortedOf(m,d))}</div>`:''}</div>
     ${S.ui.open.debEdit?delBtn(P,'debits',i):stamp(P,`debits.${i}.done`,d.done,'sm')}
   </div>`).join('');
  return `
  <div class="top"><div style="display:flex;align-items:center;gap:4px;min-width:0;flex:1">${S.ui.open.labelEdit?`<input id="m-label-top" class="period-in" data-doc="${P}" data-key="label" data-t="text" value="${esc(m.label)}" aria-label="期間の名前" enterkeyhint="done">`:`<select class="period" id="sel-month" aria-label="月を選ぶ">${ids.map(x=>`<option value="${x}" ${x===id?'selected':''}>${esc(S.months[x].label||x)}</option>`).join('')}</select><button class="del" style="color:var(--sub)" data-act="label-edit" aria-label="期間の名前を変更"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>`}</div>
   <button class="btn" data-act="new-month">＋ 次の月</button></div>
  <div class="period-row"><span class="period-k">期間</span>${datePick(P,'start',m.start,'開始日','開始日')}<span class="period-sep">〜</span>${datePick(P,'end',m.end,'終了日','終了日')}<span class="period-days num">${periodDays(m)?periodDays(m)+'日間':''}</span></div>
  <h2>今月まとめ</h2>
  <div class="panel">
    <div class="kv"><label for="m-sal">給与</label>${numIn(P,'salary',m.salary,'id="m-sal" style="font-size:18px"')}</div>

function viewSavings(){

   <div class="big num"><span class="yen">¥</span>${yen(last?.t||0)}</div>
   ${prev?`<div class="hint num" style="margin:-8px 0 8px">前回から <span class="${diff<0?'neg':'pos'}">${diff>=0?'+':''}${yen(diff)}</span></div>`:''}

let drag=null;

  const list=[...document.querySelectorAll('#app .event[data-idx]')];const el=g.closest('.event');const from=list.indexOf(el);if(from<0)return;
  const tops=list.map(x=>{const r=x.getBoundingClientRect();return {top:r.top+scrollY,h:r.height}});
  drag={el,list,from,to:from,startY:e.clientY+scrollY,tops,step:tops[from].h+10,pid:e.pointerId,lastY:e.clientY,y0:e.clientY,moved:false};

function dragUpdate(){
  if(!drag)return;const {el,list,from,tops,step}=drag;
  const y=drag.lastY+scrollY,dy=y-drag.startY;el.style.transform=`translateY(${dy}px)`;
  const center=tops[from].top+tops[from].h/2+dy;let to=from;
  list.forEach((x,i)=>{if(i===from)return;const mid=tops[i].top+tops[i].h/2;let t=0;
    if(i<from&&center<mid){t=step;to=Math.min(to,i)}
    if(i>from&&center>mid){t=-step;to=Math.max(to,i)}
    x.style.transform=t?`translateY(${t}px)`:'';});
  drag.to=to;
}

function autoScroll(){if(!drag)return;if(!drag.moved){requestAnimationFrame(autoScroll);return}const y=drag.lastY,H=innerHeight,edge=90,bottomEdge=H-90-64;let v=0;if(y<edge)v=-Math.ceil((edge-y)/6);else if(y>bottomEdge)v=Math.ceil((y-bottomEdge)/6);if(v){scrollBy(0,v);dragUpdate()}requestAnimationFrame(autoScroll)}

     const blob=new Blob([JSON.stringify({format:'kakeibo-backup-1',exportedAt:new Date().toISOString(),docs},null,1)],{type:'application/json'});
     const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kakeibo-data-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);break}
   case 'tab':{const prev=S.ui.setup?null:S.ui.tab;(S.ui.scroll=S.ui.scroll||{});if(prev)S.ui.scroll[prev]=window.scrollY;if(getCfg()&&S.loaded.months)S.ui.setup=false;S.ui.tab=b.dataset.v;S.ui.sheet=null;try{localStorage.setItem('kk.tab',S.ui.tab)}catch(_){};render(true);window.scrollTo(0,S.ui.scroll[S.ui.tab]||0);break}
   case 'ev-sort':{const id=S.ui.bonus,ev=S.bonus[id].events;const idx=ev.map((e,i)=>i).sort((a,c)=>{const da=ev[a].date||'\uffff',dc=ev[c].date||'\uffff';return da<dc?-1:da>dc?1:a-c});reorderEvents(id,idx);toast('日付順に並べました');break}
   case 'clear-end':{const bo=S.bonus[S.ui.bonus];delete bo.events[+b.dataset.ev].dateEnd;save('bonus/'+S.ui.bonus);render(true);break}
   case 'blabel-edit':S.ui.open.bLabelEdit=true;render(true);setTimeout(()=>{const i=$('#b-label-top');if(i){i.focus();i.select()}},30);break;
   case 'label-edit':S.ui.open.labelEdit=true;render(true);setTimeout(()=>{const i=$('#m-label-top');if(i){i.focus();i.select()}},30);break;
   case 'open':S.ui.open[b.dataset.k]=!S.ui.open[b.dataset.k];render(true);break;
   case 'toggle':{const d=docOf(P);setIn(d,b.dataset.key,!getIn(d,b.dataset.key));save(P);render(true);break}
   case 'del':{const d=docOf(P);const it=getIn(d,b.dataset.arr)?.[+b.dataset.idx];const nm=it?(it.n||it.name||it.title||it.date||''):'';S.ui.confirm={kind:'item',P,arr:b.dataset.arr,idx:+b.dataset.idx,msg:nm?`「${nm}」を削除しますか？`:'この行を削除しますか？'};render(true);break}
   case 'del-doc':{const d=docOf(P);S.ui.confirm={kind:'doc',P,msg:`「${d?.label||''}」をまるごと削除しますか？中の記録もすべて消えます。`};render(true);break}
   case 'confirm-cancel':S.ui.confirm=null;render(true);break;
   case 'confirm-ok':{const c=S.ui.confirm;S.ui.confirm=null;if(!c)break;
     if(c.kind==='item'){const d=docOf(c.P);const arr=getIn(d,c.arr);if(arr){releaseAcc(arr[c.idx]);arr.splice(c.idx,1);save(c.P)}}
     else{remove(c.P);S.ui.month=null;S.ui.bonus=null;toast('削除しました')}
     render(true);break}
   case 'first-month':{const id=new Date().toISOString().slice(0,7);S.months[id]=blankMonth();S.months[id].label=id;save('months/'+id);S.ui.month=id;render(true);break}
   case 'new-month':{const id=newMonthFrom(monthIds()[0]);S.ui.month=id;S.ui.open={};toast(`${id} を作成しました。給与を入れてください`);render(true);window.scrollTo(0,0);break}
   case 'add-debit':cur().debits=cur().debits||[];cur().debits.push({name:'新しい引落し',manage:'',amount:0,sorted:0,done:false});save('months/'+S.ui.month);render(true);break;
   case 'add-account':if(!S.one.assets)S.one.assets={accounts:[]};S.one.assets.accounts.push({n:'口座',a:0});save('one/assets');render(true);break;
   case 'quick':{const m=cur();if(!m)break;let i=b.dataset.env!=null?+b.dataset.env:(S.ui.lastEnv??(m.envelopes||[]).findIndex(x=>!x.balanceMode));if(m.envelopes[i]?.balanceMode)i=(m.envelopes||[]).findIndex(x=>!x.balanceMode);S.ui.sheet={env:i};render(true);setTimeout(()=>$('#q-amt')?.focus(),50);break}
   case 'pick-env':S.ui.sheet.env=+b.dataset.env;document.querySelectorAll('.pick button').forEach(x=>x.setAttribute('aria-pressed',x===b));const sb=$('#quick-form button[type=submit]');if(sb)sb.textContent=`${cur().label} の ${(S.ui.sheet.env===-1?'予算外':cur().envelopes[S.ui.sheet.env].name)} に追加`;break;
   case 'close-sheet':S.ui.sheet=null;render(true);break;
   case 'new-bonus':{const prev=latestBonus();const ids=Object.keys(S.bonus);const id='b'+Date.now().toString(36);
     const pc=prev?calcBonus(prev):null;
     S.bonus[id]={label:'新しい賞与',period:'',base:0,carry:0,saving:100000,events:[],createdAt:new Date().toISOString()};
     save('bonus/'+id);S.ui.bonus=id;toast('作成しました');render(true);break}
   case 'ev':if(b.classList.contains('is-open')&&e.target.closest('input,.date-pick'))break;S.ui.evOpen[b.dataset.k]=b.getAttribute('aria-expanded')!=='true';if(b.dataset.k==='acc')S.ui.open.accEdit=false;saveEv();render(true);break;
   case 'ev-all':{const id=S.ui.bonus;(S.bonus[id].events||[]).forEach((_,i)=>S.ui.evOpen[id+':'+i]=b.dataset.v==='1');saveEv();render(true);break}
   case 'add-event':{const bo=S.bonus[S.ui.bonus];bo.events=bo.events||[];bo.events.push({date:'',title:'',items:[{n:'',a:0,done:false}]});S.ui.evOpen[S.ui.bonus+':'+(bo.events.length-1)]=true;save('bonus/'+S.ui.bonus);render(true);break}
   case 'add-bitem':{const bo=S.bonus[S.ui.bonus];bo.events[+b.dataset.ev].items.push({n:'',a:0,done:false});save('bonus/'+S.ui.bonus);render(true);break}
   case 'init-cards':S.one.cards={cards:['Olive','NL','PayPay','その他'].map(n=>({name:n,items:[]}))};save('one/cards');render(true);break;
   case 'add-citem':S.one.cards.cards[+b.dataset.c].items.push({date:'',n:'',a:0,done:false});S.ui.cardsShowDone=S.ui.cardsShowDone;save('one/cards');render(true);break;
   case 'csrc':{const it=S.one.cards.cards[+b.dataset.c].items[+b.dataset.j];it.src=it.src===b.dataset.v?'':b.dataset.v;save('one/cards');render(true);break}
   case 'cards-done':S.ui.cardsShowDone=b.dataset.v==='1';render(true);break;
   case 'init-savings':S.one.savings={rows:[],labels:['第二口座','定期','NISA']};save('one/savings');render(true);break;
   case 'add-saving':{const d=S.one.savings;const rs=(d.rows||[]).slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)));const l=rs[rs.length-1]||{a:0,b:0,c:0};d.rows.push({date:new Date(Date.now()+9*3600e3).toISOString().slice(0,10),a:l.a,b:l.b,c:l.c});save('one/savings');toast('前回の値をコピーしました。今の残高に直してください');render(true);break}
   case 'init-funds':S.one.funds={funds:[{id:'car',name:'車関連費',opening:0,entries:[]},{id:'net',name:'通信費',opening:0,entries:[]}]};save('one/funds');render(true);break;
   case 'add-fentry':S.one.funds.funds[+b.dataset.f].entries.push({date:new Date(Date.now()+9*3600e3).toISOString().slice(0,10),n:'',a:0,kind:b.dataset.kind});save('one/funds');render(true);break;
   case 'fkind':{const e=S.one.funds.funds[+b.dataset.f].entries[+b.dataset.j];e.kind=e.kind==='in'?'out':'in';save('one/funds');render(true);break}
   case 'init-fixed':S.one.fixed={annual:[],monthly:[],car:[]};save('one/fixed');render(true);break;
   case 'add-fixed':if(!S.one.fixed)S.one.fixed={annual:[],monthly:[],car:[]};(S.one.fixed[b.dataset.k]=S.one.fixed[b.dataset.k]||[]).push({when:'',n:'',a:0,every:1,unit:'year'});save('one/fixed');render(true);break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='quick-form')return;e.preventDefault();
  const amt=evalAmount($('#q-amt').value),name=$('#q-name').value.trim();
  if(!amt){toast('金額を入れてください');$('#q-amt').focus();return}
  const m=S.months[S.ui.month],ex=S.ui.sheet.env===-1,env=ex?{name:'予算外'}:m.envelopes[S.ui.sheet.env];
  const acc=$('#q-acc').value,item={n:name||'支出',a:amt,acc};
  if(ex){m.extras=m.extras||[];m.extras.push(item)}else{env.items=env.items||[];env.items.push(item)}
  syncAcc(item);S.ui.lastAcc=acc;S.ui.lastEnv=S.ui.sheet.env;
  save('months/'+S.ui.month);S.ui.sheet=null;document.activeElement?.blur();
  toast(`${env.name} に ${yen(amt)}円 を追加しました`);render(true);
});

document.addEventListener('change',async e=>{
  if(e.target.id!=='imp-file')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  const cfg=getCfg();if(!cfg){S.ui.setupMsg='先に上で接続してください。';render(true);return}
  try{const j=JSON.parse(await f.text());const docs=j.docs||j;if(!docs||typeof docs!=='object'||!Object.keys(docs).length)throw 0;
    S.ui.setupMsg='取り込んでいます…';render(true);
    await api.post(cfg,{op:'import',docs});
    await reload();S.ui.setup=false;toast(`${Object.keys(docs).length}件のデータを取り込みました`);render(true);
  }catch(err){S.ui.setupMsg='取り込めませんでした。kakeibo-data.json を選んでいるか確認してください。';render(true)}
});
/* ---------- boot ---------- */
(()=>{
  try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(c){S.months=c.months||{};S.bonus=c.bonus||{};S.one=c.one||{};S.loaded={months:true,bonus:true,one:true}}}catch(e){}
  const cfg=getCfg();
  if(cfg){S.db=makeDb(cfg);reload()}else{S.ui.setup=true}
  render(true);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reload(true)});
  window.addEventListener('online',()=>{retryFailed();reload(true)});
})();
})();
</script>
